<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pat Aksesuar - Operasyon Paneli</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: #1e293b; border: 1px solid #334155; padding: 2.5rem; border-radius: 1rem; max-width: 520px; width: 90%; text-align: center; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5); }
    .badge { display: inline-block; background: #059669; color: #ecfdf5; font-size: 0.85rem; font-weight: 600; padding: 0.35rem 0.85rem; border-radius: 9999px; margin-bottom: 1.25rem; }
    h1 { font-size: 1.75rem; margin-bottom: 0.75rem; color: #fff; }
    p { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; margin-bottom: 1.5rem; }
    .status-box { background: #0f172a; border: 1px solid #334155; border-radius: 0.5rem; padding: 1rem; margin-bottom: 1.5rem; text-align: left; font-family: monospace; font-size: 0.85rem; color: #38bdf8; }
    .btn { display: inline-block; background: #2563eb; color: #fff; text-decoration: none; padding: 0.75rem 1.5rem; border-radius: 0.5rem; font-weight: 500; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Sistem Aktif</div>
    <h1>Pat Aksesuar Operasyon</h1>
    <p>Trendyol API entegrasyonu ve operasyon yönetim paneli başarıyla devrede.</p>
    <div class="status-box">
      • Servis: Render.com Cloud<br>
      • Durum: 200 OK<br>
      • Modül: Canlı Barkod &amp; Sipariş Akışı
    </div>
    <a href="/api/health" class="btn">API Sağlık Kontrolü</a>
  </div>
</body>
</html>
